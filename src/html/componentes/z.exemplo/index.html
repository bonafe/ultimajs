<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exemplo Componente com Conexão Bidirecionado de Dados</title>
    <script src="./br-teste.js" type="module"></script>    
    <script type="module">

        import {ComponenteBase} from '../componente_base.js';

        window.addEventListener('load', () => {
            const brTeste = document.querySelector('br-teste');
            //O evento também borbulha de qualquer br-endereco aninhado que carregar depois (dentro
            //da lista de endereços); sem a checagem, cada um deles reexecutava este listener, que
            //setava data-dados de novo, recriando a lista inteira — loop infinito. Usa
            //composedPath()[0] em vez de evento.target porque br-endereco tem seu próprio shadow
            //root: o navegador faz "retargeting" e evento.target aparece como brTeste mesmo vindo
            //de dentro do br-endereco aninhado.
            brTeste.addEventListener(ComponenteBase.EVENTO_CARREGOU, (evento) => {

                if (evento.composedPath()[0] !== brTeste) {
                    return;
                }

                console.log('brTeste carregou');

                let json_dados_pessoa_com_2_enderecos = {
                    nome: 'Fulano de Tal',
                    telefone: '11 99999-9999',
                    email: 'a@a.com',
                    enderecos:[
                        {
                            rua: 'Rua 1',
                            numero: '123',
                            bairro: 'Bairro 1',
                            cidade: 'Cidade 1',
                            estado: 'Estado 1',
                            cep: '12345-678',
                            complemento: 'Complemento 1'
                        },
                        {
                            rua: 'Rua 2',
                            numero: '456',
                            bairro: 'Bairro 2',
                            cidade: 'Cidade 2',
                            estado: 'Estado 2',
                            cep: '98765-432',
                            complemento: 'Complemento 2'
                        }
                    ]
                    ,
                    observacoes: 'está é uma grande observação',
                    ativo: true,
                    exibir_endereco: true,
                    exibir_observacoes: true
                };

                brTeste.setAttribute('data-dados', JSON.stringify(json_dados_pessoa_com_2_enderecos));
                
            });
        });
    </script>
</head>
<body>
    <br-teste data-dados='{"nome":"abelha"}'></br-teste>
    <button onclick="console.log(document.querySelector('br-teste').dataset)">Salvar</button>
</body>
</html>
