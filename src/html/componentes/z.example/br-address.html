<div id="address">
    <div class="form-row">
        <div class="form-group half-width">
            <label for="inputStreet">Street</label>
            <input type="text" id="inputStreet" data-bind='{"value":"street"}' class='form-control'>
        </div>
        <div class="form-group third-width">
            <label for="inputNumber">Number</label>
            <input type="text" id="inputNumber" data-bind='{"value":"number"}' class='form-control'>
        </div>
        <div class="form-group third-width">
            <label for="inputNeighborhood">Neighborhood</label>
            <input type="text" id="inputNeighborhood" data-bind='{"value":"neighborhood"}' class='form-control'>
        </div>
    </div>
    <div class="form-row">
        <div class="form-group half-width">
            <label for="inputCity">City</label>
            <input type="text" id="inputCity" data-bind='{"value":"city"}' class='form-control'>
        </div>
        <div class="form-group third-width">
            <label for="inputState">State</label>
            <input type="text" id="inputState" data-bind='{"value":"state"}' class='form-control'>
        </div>
        <div class="form-group third-width">
            <label for="inputZip">Zip</label>
            <input type="text" id="inputZip" data-bind='{"value":"zip"}' class='form-control'>
        </div>
    </div>
    <div class="form-row">
        <div class="form-group full-width">
            <label for="inputUnit">Unit</label>
            <input type="text" id="inputUnit" data-bind='{"value":"unit"}' class='form-control'>
        </div>
    </div>
</div>
