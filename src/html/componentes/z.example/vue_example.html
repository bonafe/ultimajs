<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vue.js Form Example</title>
  <script src="https://cdn.jsdelivr.net/npm/vue@2"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .form-container {
      max-width: 800px;
      margin: auto;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      margin-bottom: 15px;
    }
    .form-group label {
      margin-bottom: 5px;
    }
    .form-control {
      padding: 10px;
      font-size: 1em;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    .form-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
    }
    .form-group.half-width {
      flex: 0 0 48%;
    }
    .form-group.third-width {
      flex: 0 0 31%;
    }
    .form-group.full-width {
      flex: 0 0 100%;
    }
    @media (max-width: 600px) {
      .form-group.half-width, .form-group.third-width {
        flex: 0 0 100%;
      }
    }
  </style>
</head>
<body>
  <div id="app" class="form-container">
    <form>
      <div class="form-row">
        <div class="form-group half-width">
          <label for="inputName">Name</label>
          <input type="text" id="inputName" v-model="form.name" class="form-control">
        </div>
        <div class="form-group half-width">
          <label for="inputPhone">Phone</label>
          <input type="text" id="inputPhone" v-model="form.phone" class="form-control">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group full-width">
          <label for="inputEmail">Email</label>
          <input type="email" id="inputEmail" v-model="form.email" class="form-control">
        </div>
      </div>
      <div v-for="(address, index) in form.addresses" :key="index">
        <div class="address-title">Address {{ index + 1 }}</div>
        <div class="form-row">
          <div class="form-group half-width">
            <label :for="'inputStreet' + index">Street</label>
            <input type="text" :id="'inputStreet' + index" v-model="address.street" class="form-control">
          </div>
          <div class="form-group third-width">
            <label :for="'inputNumber' + index">Number</label>
            <input type="text" :id="'inputNumber' + index" v-model="address.number" class="form-control">
          </div>
          <div class="form-group third-width">
            <label :for="'inputNeighborhood' + index">Neighborhood</label>
            <input type="text" :id="'inputNeighborhood' + index" v-model="address.neighborhood" class="form-control">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group half-width">
            <label :for="'inputCity' + index">City</label>
            <input type="text" :id="'inputCity' + index" v-model="address.city" class="form-control">
          </div>
          <div class="form-group third-width">
            <label :for="'inputState' + index">State</label>
            <input type="text" :id="'inputState' + index" v-model="address.state" class="form-control">
          </div>
          <div class="form-group third-width">
            <label :for="'inputZip' + index">Zip</label>
            <input type="text" :id="'inputZip' + index" v-model="address.zip" class="form-control">
          </div>
        </div>
        <div class="form-row">
          <div class="form-group full-width">
            <label :for="'inputUnit' + index">Unit</label>
            <input type="text" :id="'inputUnit' + index" v-model="address.unit" class="form-control">
          </div>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group full-width">
          <label for="inputNotes">Notes</label>
          <input type="text" id="inputNotes" v-model="form.notes" class="form-control">
        </div>
      </div>
      <div class="form-row">
        <div class="form-group full-width">
          <label for="inputActive">Active</label>
          <input type="checkbox" id="inputActive" v-model="form.active" class="form-control">
        </div>
      </div>
    </form>
  </div>
<button id="show" onclick="show()">Show</button>
  <script>
    let vuePersonForm = new Vue({
      el: document.querySelector('#app'),
      data() {
        return {
          form: {
            name: 'test',
            phone: '111',
            email: '@@@',
            addresses: [
              {
                street: 'amelia street',
                number: '',
                neighborhood: '',
                city: '',
                state: '',
                zip: '',
                unit: ''
              },
              {
                street: 'cintra street',
                number: '',
                neighborhood: '',
                city: '',
                state: '',
                zip: '',
                unit: ''
              }
            ],
            notes: 'notes',
            active: true
          }
        };
      }
    });

    function show(){
      console.log(vuePersonForm.form);
    }

  </script>
</body>
</html>
