<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ultima — benchmark implementation</title>
</head>
<body>

<bench-counter id="counter"></bench-counter>
<bench-list id="list"></bench-list>
<bench-conditional id="conditional"></bench-conditional>
<bench-binding id="binding"></bench-binding>

<script type="module">
  import { ComponentBase } from '../../src/component_base.js';
  import './ultima/bench-counter/bench-counter.js';
  import './ultima/bench-list/bench-list.js';
  import './ultima/bench-conditional/bench-conditional.js';
  import './ultima/bench-binding/bench-binding.js';

  const elCounter = document.getElementById('counter');
  const elList = document.getElementById('list');
  const elConditional = document.getElementById('conditional');
  const elBinding = document.getElementById('binding');

  function whenLoaded(element) {
    if (element.loaded) {
      return Promise.resolve();
    }
    return new Promise(resolve => {
      element.addEventListener(ComponentBase.LOADED_EVENT, function listener(event) {
        if (event.composedPath()[0] !== element) {
          return;
        }
        element.removeEventListener(ComponentBase.LOADED_EVENT, listener);
        resolve();
      });
    });
  }

  const ready = Promise.all([
    whenLoaded(elCounter),
    whenLoaded(elList),
    whenLoaded(elConditional),
    whenLoaded(elBinding)
  ]).then(() => {});

  window.bench = {
    ready,
    counter: {
      reset: () => elCounter.reset(),
      increment: (n) => elCounter.incrementTimes(n),
      currentValue: () => elCounter.currentValue()
    },
    list: {
      create: (n) => elList.create(n),
      updatePartial: () => elList.updatePartial(),
      swap: () => elList.swap(),
      remove: () => elList.remove(),
      clear: () => elList.clear(),
      countRows: () => elList.countRows()
    },
    conditional: {
      reset: () => elConditional.reset(),
      toggle: (n) => elConditional.toggleTimes(n),
      currentState: () => elConditional.currentState()
    },
    binding: {
      reset: () => elBinding.reset(),
      write: (n) => elBinding.writeTimes(n),
      currentValue: () => elBinding.currentValue()
    }
  };
</script>

</body>
</html>
