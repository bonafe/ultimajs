<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>VanJS — implementação de benchmark</title>
</head>
<body>

<div id="contador"></div>
<div id="lista"></div>
<div id="condicional"></div>
<div id="binding"></div>

<script type="module">
  import van from 'https://cdn.jsdelivr.net/gh/vanjs-org/van/public/van-1.6.1.min.js';

  const { span, div, table, tbody, tr, td, input } = van.tags;

  const ADJETIVOS = ['rápido', 'lento', 'grande', 'pequeno', 'azul', 'verde', 'vermelho', 'claro', 'escuro', 'novo'];
  const SUBSTANTIVOS = ['carro', 'mesa', 'nuvem', 'rio', 'monte', 'vento', 'campo', 'porto', 'vale', 'lago'];
  function rotuloAleatorio() {
    const a = ADJETIVOS[Math.floor(Math.random() * ADJETIVOS.length)];
    const s = SUBSTANTIVOS[Math.floor(Math.random() * SUBSTANTIVOS.length)];
    return `${a} ${s}`;
  }
  let proximoId = 1;

  // --- Contador ---
  const contadorState = van.state(0);
  van.add(document.getElementById('contador'), span({ class: 'valor' }, contadorState));

  // --- Condicional ---
  const abertoState = van.state(false);
  van.add(document.getElementById('condicional'),
    () => abertoState.val
      ? div({ class: 'bloco-visivel' }, 'visível')
      : div({ class: 'bloco-oculto' }, 'oculto')
  );

  // --- Binding ---
  const textoState = van.state('');
  const campoBinding = input({ type: 'text', class: 'campo', value: textoState, oninput: (e) => { textoState.val = e.target.value; } });
  van.add(document.getElementById('binding'), campoBinding, span({ class: 'eco' }, textoState));

  // --- Lista: sem reconciliação por chave (não existe no VanJS — os nós DOM retornados por
  // van.tags SÃO os elementos reais; a identidade é preservada mantendo a referência ao nó,
  // não por um mecanismo de diffing). "trocar" move os nós DOM manualmente.
  const corpoLista = tbody();
  van.add(document.getElementById('lista'), table({}, corpoLista));
  let linhas = [];

  function criar(n) {
    corpoLista.replaceChildren();
    linhas = [];
    const frag = document.createDocumentFragment();
    for (let i = 0; i < n; i++) {
      const id = proximoId++;
      const rotuloState = van.state(rotuloAleatorio());
      const dom = tr({}, td({ class: 'coluna-id' }, id), td({ class: 'coluna-rotulo' }, rotuloState));
      frag.appendChild(dom);
      linhas.push({ id, rotuloState, dom });
    }
    van.add(corpoLista, frag);
  }

  function atualizarParcial() {
    linhas.forEach((linha, indice) => {
      if (indice % 10 === 0) {
        linha.rotuloState.val = linha.rotuloState.val + ' !!!';
      }
    });
  }

  function trocar() {
    let i = 1, j = 998;
    if (linhas.length <= 998) {
      if (linhas.length <= 1) { return; }
      i = 0; j = linhas.length - 1;
    }
    const domA = linhas[i].dom, domB = linhas[j].dom;
    [linhas[i], linhas[j]] = [linhas[j], linhas[i]];

    const parent = domA.parentNode;
    const proximoDeA = domA.nextSibling;
    parent.insertBefore(domA, domB);
    parent.insertBefore(domB, proximoDeA);
  }

  function remover() {
    if (linhas.length === 0) { return; }
    const linha = linhas.shift();
    linha.dom.remove();
  }

  function limpar() {
    corpoLista.replaceChildren();
    linhas = [];
  }

  window.bench = {
    pronto: Promise.resolve(),
    contador: {
      reset: () => { contadorState.val = 0; },
      incrementar: (n) => { for (let i = 0; i < n; i++) { contadorState.val++; } },
      valorAtual: () => contadorState.val
    },
    lista: {
      criar,
      atualizarParcial,
      trocar,
      remover,
      limpar,
      contarLinhas: () => linhas.length
    },
    condicional: {
      reset: () => { abertoState.val = false; },
      alternar: (n) => { for (let i = 0; i < n; i++) { abertoState.val = !abertoState.val; } },
      estadoAtual: () => abertoState.val
    },
    binding: {
      reset: () => { textoState.val = ''; },
      escrever: (n) => {
        for (let i = 0; i < n; i++) {
          campoBinding.value = `valor-${i}`;
          campoBinding.dispatchEvent(new Event('input', { bubbles: true }));
        }
      },
      valorAtual: () => textoState.val
    }
  };
</script>

</body>
</html>
