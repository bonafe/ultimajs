<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Lit — implementação de benchmark</title>
</head>
<body>

<bench-contador id="contador"></bench-contador>
<bench-lista id="lista"></bench-lista>
<bench-condicional id="condicional"></bench-condicional>
<bench-binding id="binding"></bench-binding>

<script type="module">
  import { LitElement, html } from 'https://cdn.jsdelivr.net/npm/lit@3/+esm';
  import { repeat } from 'https://cdn.jsdelivr.net/npm/lit@3/directives/repeat.js/+esm';

  class BenchContador extends LitElement {
    static properties = { count: {} };
    constructor() { super(); this.count = 0; }
    createRenderRoot() { return this; }
    render() { return html`<span class="valor">${this.count}</span>`; }
    reset() { this.count = 0; }
    incrementarVezes(n) { for (let i = 0; i < n; i++) { this.count = this.count + 1; } }
    valorAtual() { return this.count; }
  }
  customElements.define('bench-contador', BenchContador);

  class BenchCondicional extends LitElement {
    static properties = { aberto: {} };
    constructor() { super(); this.aberto = false; }
    createRenderRoot() { return this; }
    render() {
      return this.aberto
        ? html`<div class="bloco-visivel">visível</div>`
        : html`<div class="bloco-oculto">oculto</div>`;
    }
    reset() { this.aberto = false; }
    alternarVezes(n) { for (let i = 0; i < n; i++) { this.aberto = !this.aberto; } }
    estadoAtual() { return this.aberto; }
  }
  customElements.define('bench-condicional', BenchCondicional);

  class BenchBinding extends LitElement {
    static properties = { texto: {} };
    constructor() { super(); this.texto = ''; }
    createRenderRoot() { return this; }
    render() {
      return html`
        <input class="campo" type="text" .value=${this.texto} @input=${(e) => { this.texto = e.target.value; }}>
        <span class="eco">${this.texto}</span>
      `;
    }
    reset() { this.texto = ''; }
    escreverVezes(n) {
      const campo = this.querySelector('.campo');
      for (let i = 0; i < n; i++) {
        campo.value = `valor-${i}`;
        campo.dispatchEvent(new Event('input', { bubbles: true }));
      }
    }
    valorAtual() { return this.texto; }
  }
  customElements.define('bench-binding', BenchBinding);

  const ADJETIVOS = ['rápido', 'lento', 'grande', 'pequeno', 'azul', 'verde', 'vermelho', 'claro', 'escuro', 'novo'];
  const SUBSTANTIVOS = ['carro', 'mesa', 'nuvem', 'rio', 'monte', 'vento', 'campo', 'porto', 'vale', 'lago'];
  function rotuloAleatorio() {
    const a = ADJETIVOS[Math.floor(Math.random() * ADJETIVOS.length)];
    const s = SUBSTANTIVOS[Math.floor(Math.random() * SUBSTANTIVOS.length)];
    return `${a} ${s}`;
  }
  let proximoId = 1;

  class BenchLista extends LitElement {
    static properties = { linhas: {} };
    constructor() { super(); this.linhas = []; }
    createRenderRoot() { return this; }
    render() {
      return html`
        <table><tbody>
          ${repeat(this.linhas, (linha) => linha.id, (linha) => html`
            <tr>
              <td class="coluna-id">${linha.id}</td>
              <td class="coluna-rotulo">${linha.rotulo}</td>
            </tr>
          `)}
        </tbody></table>
      `;
    }
    criar(n) {
      const linhas = [];
      for (let i = 0; i < n; i++) {
        linhas.push({ id: proximoId++, rotulo: rotuloAleatorio() });
      }
      this.linhas = linhas;
    }
    atualizarParcial() {
      this.linhas = this.linhas.map((linha, indice) =>
        indice % 10 === 0 ? { ...linha, rotulo: linha.rotulo + ' !!!' } : linha
      );
    }
    trocar() {
      const linhas = this.linhas.slice();
      if (linhas.length > 998) {
        [linhas[1], linhas[998]] = [linhas[998], linhas[1]];
      } else if (linhas.length > 1) {
        [linhas[0], linhas[linhas.length - 1]] = [linhas[linhas.length - 1], linhas[0]];
      }
      this.linhas = linhas;
    }
    remover() {
      if (this.linhas.length === 0) { return; }
      this.linhas = this.linhas.slice(1);
    }
    limpar() { this.linhas = []; }
    contarLinhas() { return this.linhas.length; }
  }
  customElements.define('bench-lista', BenchLista);

  const elContador = document.getElementById('contador');
  const elLista = document.getElementById('lista');
  const elCondicional = document.getElementById('condicional');
  const elBinding = document.getElementById('binding');

  window.bench = {
    pronto: Promise.all([
      elContador.updateComplete,
      elLista.updateComplete,
      elCondicional.updateComplete,
      elBinding.updateComplete
    ]).then(() => {}),
    contador: {
      reset: () => elContador.reset(),
      incrementar: (n) => elContador.incrementarVezes(n),
      valorAtual: () => elContador.valorAtual()
    },
    lista: {
      criar: (n) => elLista.criar(n),
      atualizarParcial: () => elLista.atualizarParcial(),
      trocar: () => elLista.trocar(),
      remover: () => elLista.remover(),
      limpar: () => elLista.limpar(),
      contarLinhas: () => elLista.contarLinhas()
    },
    condicional: {
      reset: () => elCondicional.reset(),
      alternar: (n) => elCondicional.alternarVezes(n),
      estadoAtual: () => elCondicional.estadoAtual()
    },
    binding: {
      reset: () => elBinding.reset(),
      escrever: (n) => elBinding.escreverVezes(n),
      valorAtual: () => elBinding.valorAtual()
    }
  };
</script>

</body>
</html>
